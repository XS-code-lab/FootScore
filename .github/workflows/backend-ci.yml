name: Backend CI
on:
  push:
    branches: [main, feature/backend-foundation]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,ml]'
      - run: ruff check .
      - name: Pilot offline end-to-end smoke
        run: pytest -q tests/test_pilot_e2e.py
      - name: Complete test suite
        run: pytest -q
