[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "footscore-backend"
version = "0.6.0"
description = "FootScore backend API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "httpx>=0.27,<1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "apscheduler>=3.10,<4",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.9,<3",
  "email-validator>=2,<3",
  "redis>=5.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
push = ["firebase-admin>=6.6,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
# FastAPI intentionally resolves Depends(...) in function defaults.
ignore = ["B008"]
